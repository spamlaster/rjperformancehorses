name: Test and deploy

# Pull requests run the tests. A merge (push) to main runs the tests, then
# deploys to the VPS, but only when the repo variable DEPLOY_ENABLED is "true".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rjph_test
          MYSQL_USER: rjph
          MYSQL_PASSWORD: rjph_local
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pcntl, posix
          coverage: none
      - name: Laravel tests (MySQL)
        working-directory: api
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: rjph
          DB_PASSWORD: rjph_local
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      # Dependencies are built here so the VPS needs no Composer and no extra memory.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Production PHP dependencies
        working-directory: api
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # -rlptz (not -a): keep the server's file owners/groups. .env and storage/
      # live only on the server and are never overwritten or deleted.
      - name: Upload
        run: |
          rsync -rlptz --delete dist/ "$TARGET:/var/www/rjph/web/"
          rsync -rlptz --delete --exclude .env --exclude storage --exclude tests --exclude node_modules \
            api/ "$TARGET:/var/www/rjph/api/"

      - name: Migrate and reload
        run: |
          ssh "$TARGET" 'set -e
            cd /var/www/rjph/api
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            sudo -n systemctl reload php8.3-fpm'
