# /etc/nginx/sites-available/rjperformancehorses.com  (TLS lines are added by certbot)
server {
    listen 80;
    server_name rjperformancehorses.com www.rjperformancehorses.com;

    root /var/www/rjph/web;   # Vite dist/
    index index.html;

    # Everything under /api goes to Laravel (including /api/sanctum/csrf-cookie).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/rjph/api/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-rjph.sock;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
