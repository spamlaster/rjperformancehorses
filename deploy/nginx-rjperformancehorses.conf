# /etc/nginx/sites-available/rjperformancehorses (enabled via symlink)
# The existing certbot site file, with the /api and /assets blocks added.
server {

    server_name rjperformancehorses.com www.rjperformancehorses.com;

    root /var/www/rjperformancehorses/dist;
    index index.html;

    # Everything under /api goes to Laravel (including /api/sanctum/csrf-cookie).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/rjperformancehorses/api/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Vite assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rjperformancehorses.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rjperformancehorses.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.rjperformancehorses.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rjperformancehorses.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name rjperformancehorses.com www.rjperformancehorses.com;
    return 404; # managed by Certbot


}
