; /etc/php/8.3/fpm/pool.d/rjph.conf — RJ's own pool; other sites' pools are untouched.
[rjph]
user = rjph
group = rjph
listen = /run/php/php8.3-fpm-rjph.sock
listen.owner = www-data
listen.group = www-data

; ~0 MB idle; raise max_children after the RAM upgrade.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
